<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Personbevis</title>
  <link rel="stylesheet" href="ui.css?v=1">
  <style id="pb-doc-css"></style>
</head>
<body class="pb-tool-page">

<div id="app-ui">
  <header class="top">
    <h1>Personbevis</h1>
    <p class="lead">Klistra in uppgifter → Generera → PDF</p>
  </header>

  <section class="panel">
    <label for="pb-paste">Namn, personnummer, adress …</label>
    <textarea id="pb-paste" rows="5" placeholder="Nils Rauner
200708053293
Tulegatan 20
113 53 Stockholm"></textarea>
    <p class="hint">Minst 4 rader: namn, personnummer, gata, postadress. Eller klistra in fri text / HTML.</p>
    <button type="button" class="btn-block" id="btn-generate">Generera</button>
  </section>

  <section class="panel">
    <div class="field-row">
      <div class="field">
        <label for="pb-type">Ändamål</label>
        <select id="pb-type"></select>
      </div>
      <div class="field">
        <label for="pb-lang">Språk</label>
        <select id="pb-lang">
          <option value="sv">Svenska</option>
          <option value="en">Engelska</option>
          <option value="ga">Iriska</option>
        </select>
      </div>
    </div>

    <details class="more">
      <summary>Fler uppgifter</summary>
      <div class="field" style="margin-top:10px">
        <button type="button" class="btn-secondary" id="pb-open" style="width:100%;min-height:44px;border-radius:10px;border:1px solid #2d3a4d;background:#243044;color:#e7ecf3;font-weight:600">Öppna alla fält…</button>
      </div>
    </details>
  </section>

  <div id="error"></div>
</div>

<!-- Hidden hooks expected by core -->
<button type="button" id="pb-print" hidden>print</button>
<button type="button" id="pb-parse" hidden>parse</button>
<button type="button" id="pb-apply" hidden>apply</button>
<button type="button" id="pb-clear" hidden>clear</button>
<button type="button" id="pb-fetch" hidden>fetch</button>
<input type="url" id="pb-url" hidden>
<div class="pb-status" id="pb-parse-status" hidden></div>
<div class="pb-status" id="pb-fetch-status" hidden></div>
<span class="pb-saved" id="pb-saved" hidden></span>

<div class="pb-backdrop pb-hidden" id="pb-backdrop" style="display:none">
  <div class="pb-panel" style="background:#1a2332;color:#e7ecf3;max-width:720px;margin:20px auto;padding:16px;border-radius:12px;max-height:80vh;overflow:auto">
    <h2 style="margin-top:0">Personuppgifter</h2>
    <div class="pb-grid" id="pb-fields" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
    <h3>Språkberoende</h3>
    <div class="pb-l10n" id="pb-l10n"></div>
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button type="button" id="pb-modal-close" style="min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #2d3a4d;background:#243044;color:#fff">Stäng</button>
      <button type="button" id="pb-modal-apply" style="min-height:44px;padding:0 14px;border-radius:10px;border:0;background:#3b82f6;color:#fff;font-weight:700">Visa</button>
    </div>
  </div>
</div>

<div id="preview-wrap" hidden>
  <div class="preview-bar">
    <span id="preview-label">Blankett</span>
    <button type="button" class="btn-text" id="btn-top">Till formuläret</button>
  </div>
  <div id="pb-doc"></div>
</div>

<nav class="dock" aria-label="Åtgärder">
  <button type="button" class="btn-secondary" id="btn-example">Exempel</button>
  <button type="button" class="btn-primary" id="btn-generate-dock">Generera</button>
  <button type="button" class="btn-print" id="btn-print" disabled>PDF</button>
</nav>

<script src="logo.js?v=1"></script>
<script src="_core.js?v=1"></script>
<script src="shell.js?v=1"></script>
</body>
</html>
