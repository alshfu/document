<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <title>Bankutdrag</title>
  <link rel="stylesheet" href="ui.css?v=2">
  <link rel="stylesheet" href="doc.css?v=2">
  <style>
    .banks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 4px; }
    .banks button {
      min-height: 48px; border-radius: 12px; border: 1px solid var(--border);
      background: #0d121a; color: var(--text); font: inherit; font-weight: 700;
      font-size: .9rem; cursor: pointer;
    }
    .banks button.active {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .periods { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .periods button {
      min-height: 44px; border-radius: 12px; border: 1px solid var(--border);
      background: #0d121a; color: var(--text); font: inherit; font-weight: 600;
      cursor: pointer;
    }
    .periods button.active {
      background: #243044; border-color: var(--accent); color: #fff;
    }
    .money { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  </style>
</head>
<body>

<div id="app-ui">
  <header class="top">
    <h1>Bankutdrag</h1>
    <p class="lead">Fyll i → Generera → PDF</p>
  </header>

  <section class="panel">
    <label for="paste">Vem?</label>
    <textarea id="paste" rows="3" placeholder="Anna Andersson
Storgatan 1
111 22 Stockholm"></textarea>
  </section>

  <section class="panel">
    <label>Bank</label>
    <div class="banks" id="banks">
      <button type="button" data-bank="nordea" class="active">Nordea</button>
      <button type="button" data-bank="swedbank">Swedbank</button>
      <button type="button" data-bank="revolut">Revolut</button>
    </div>
  </section>

  <section class="panel">
    <label>Period</label>
    <div class="periods" id="periods">
      <button type="button" data-months="1">1 mån</button>
      <button type="button" data-months="3" class="active">3 mån</button>
      <button type="button" data-months="6">6 mån</button>
    </div>
  </section>

  <section class="panel">
    <label>Per månad (SEK)</label>
    <div class="money">
      <div class="field" style="margin:0">
        <label for="income">Inkomst</label>
        <input id="income" type="number" value="32000" inputmode="numeric">
      </div>
      <div class="field" style="margin:0">
        <label for="spend">Utgifter</label>
        <input id="spend" type="number" value="18000" inputmode="numeric">
      </div>
    </div>
    <button type="button" class="btn-block" id="btn-generate">Generera</button>
  </section>

  <div id="error"></div>
</div>

<div id="preview-wrap" hidden>
  <div class="preview-bar">
    <span id="preview-label">Utdrag</span>
    <button type="button" class="btn-text" id="btn-top">Tillbaka</button>
  </div>
  <div id="preview"></div>
</div>

<nav class="dock" aria-label="Åtgärder">
  <button type="button" class="btn-secondary" id="btn-example">Exempel</button>
  <button type="button" class="btn-primary" id="btn-generate-dock">Generera</button>
  <button type="button" class="btn-print" id="btn-print" disabled>PDF</button>
</nav>

<!-- hidden defaults used by app -->
<input type="hidden" id="bank" value="nordea">
<input type="hidden" id="months" value="3">
<input type="hidden" id="from">
<input type="hidden" id="to">
<input type="hidden" id="account">
<input type="hidden" id="clearing">
<input type="hidden" id="bic">
<input type="hidden" id="iban">
<input type="hidden" id="startBalance" value="4500">
<input type="hidden" id="payday" value="25">
<input type="hidden" id="salaryDesc" value="Lön">
<input type="hidden" id="seed" value="42">

<script src="synth.js?v=2"></script>
<script src="render.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
