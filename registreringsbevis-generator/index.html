<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <title>Registreringsbevis</title>
  <link rel="stylesheet" href="ui.css?v=1">
  <link rel="stylesheet" href="doc.css?v=1">
</head>
<body>

<div id="app-ui">
  <header class="top">
    <h1>Registreringsbevis</h1>
    <p class="lead">Klistra in företagsuppgifter → Generera → PDF</p>
  </header>

  <section class="panel">
    <label for="paste">Företagsnamn, org.nr, adress</label>
    <textarea id="paste" rows="5" placeholder="Gotbit AB
559436-6022
Doktor Saléns Gata 5
413 22 GÖTEBORG"></textarea>
    <p class="hint">Minst 3–4 rader. Organisationsnummer med eller utan bindestreck.</p>
    <button type="button" class="btn-block" id="btn-generate">Generera</button>
  </section>

  <section class="panel">
    <div class="field">
      <label for="bolagsform">Bolagsform</label>
      <select id="bolagsform">
        <option value="AKTIEBOLAG">Aktiebolag</option>
        <option value="HANDELSBOLAG">Handelsbolag</option>
        <option value="KOMMANDITBOLAG">Kommanditbolag</option>
        <option value="ENKELT BOLAG">Enkelt bolag</option>
      </select>
    </div>
    <details class="more">
      <summary>Fler uppgifter</summary>
      <div class="field-row">
        <div class="field">
          <label for="regDatum">Registreringsdatum</label>
          <input id="regDatum" type="date">
        </div>
        <div class="field">
          <label for="bildat">Bildat datum</label>
          <input id="bildat" type="date">
        </div>
      </div>
      <div class="field">
        <label for="adress1">Adress rad 1</label>
        <input id="adress1">
      </div>
      <div class="field">
        <label for="adress2">Adress rad 2</label>
        <input id="adress2">
      </div>
      <div class="field">
        <label for="sate">Säte (län, kommun)</label>
        <input id="sate" placeholder="Västra Götalands län, Göteborgs kommun">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="aktiekapital">Aktiekapital (SEK)</label>
          <input id="aktiekapital" value="25.000">
        </div>
        <div class="field">
          <label for="aktiekapitalHogst">Högst kapital</label>
          <input id="aktiekapitalHogst" value="100.000">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="antalAktier">Antal aktier</label>
          <input id="antalAktier" value="250">
        </div>
        <div class="field">
          <label for="antalAktierHogst">Högst antal</label>
          <input id="antalAktierHogst" value="1.000">
        </div>
      </div>
      <div class="field">
        <label for="styrelse">Styrelseledamot (namn)</label>
        <input id="styrelse">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="styrelsePnr">Ledamot personnummer</label>
          <input id="styrelsePnr" placeholder="ÅÅMMDD-XXXX">
        </div>
        <div class="field">
          <label for="styrelseAdress">Ledamot adress</label>
          <input id="styrelseAdress">
        </div>
      </div>
      <div class="field">
        <label for="firmateckning">Firmateckning</label>
        <input id="firmateckning" value="Firman tecknas av styrelsen">
      </div>
      <div class="field">
        <label for="verksamhet">Verksamhet</label>
        <textarea id="verksamhet" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="rakenskapsar">Räkenskapsår</label>
        <input id="rakenskapsar" value="0101 - 1231">
      </div>
    </details>
  </section>

  <div id="error"></div>
</div>

<div id="preview-wrap" hidden>
  <div class="preview-bar">
    <span id="preview-label">Blankett</span>
    <button type="button" class="btn-text" id="btn-top">Till formuläret</button>
  </div>
  <div id="preview"></div>
</div>

<nav class="dock" aria-label="Åtgärder">
  <button type="button" class="btn-secondary" id="btn-example">Exempel</button>
  <button type="button" class="btn-primary" id="btn-generate-dock">Generera</button>
  <button type="button" class="btn-print" id="btn-print" disabled>PDF</button>
</nav>

<script src="render.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
